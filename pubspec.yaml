name: haru_app
description: DAYVE - 오늘 내게 남은 시간과 돈을 보여주는 생활 계기판.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  timezone: ^0.10.1
  flutter_local_notifications: ^19.4.1
  home_widget: ^0.9.4
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/dayve_app_mark.png
  remove_alpha_ios: true
  adaptive_icon_background: "#7C86E8"
  adaptive_icon_foreground: assets/images/dayve_app_mark.png
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: assets/images/dayve_app_mark.png
    background_color: "#7C86E8"
    theme_color: "#7C86E8"

flutter:
  uses-material-design: true
  assets:
    - assets/images/dayve_app_mark.png
    - assets/images/dayve_pixel_cat.png
    - assets/day_backgrounds/morning.png
    - assets/day_backgrounds/day.png
    - assets/day_backgrounds/evening.png
    - assets/day_backgrounds/night.png
